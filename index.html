<!DOCTYPE html>
<html lang="en">

<head>
    <title>DOM Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>DOM Practice</h1>
    <p>Youtube Subscribe Button</p>
    <button class="js-subscribe-button subscribe-button" onclick="
    subscribe()
        ">Subscribe</button>
    <h2>Amazon Shipping calculator</h2>
    <p>Orders under $40 = =$10 shipping.</p>
    <p>Orders over $40 = Free shipping</p>
    <input type="text" class="js-cost-input cost-input" placeholder="Cost of order"
        onkeydown=" handleCostKeyDown(event)">
    <button class="calculate-btn" onclick="calculateTotal()">Calculate</button>
    <p class="js-total-cost"></p>

    <p>Todo List</p>
    <input class="js-name-input" placeholder="todo name" onkeydown="handleTodoKeyDown(event)">
    <button onclick="addTodo()">Add</button>
    <div class="result"></div>

    <script>

        /* subscribe button */

        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');
            if (buttonElement.innerHTML === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
                buttonElement.classList.add('is-subscribed')
            }
            else {
                buttonElement.innerHTML = 'Subscribe';
                buttonElement.classList.remove('is-subscribed')
            }
        }

        /* Amazon Shipping Calculator */

        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            const result = document.querySelector('.result').innerHTML
            let cost = Number(inputElement.value);
            if (cost < 40) {
                cost += 10
                console.log(cost)
            }
            document.querySelector('.js-total-cost').innerHTML = `$${cost}`
        }

        function handleCostKeyDown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }

        /* Todo list */

        function renderTodoList() {
            let todoListHTML = ''
            for (let i = 0; i < todolist.length; i++) {
                const todo = todolist[i];
                const html = `<p>${todo}</p>`;
                todoListHTML += html;
                document.querySelector('.result').innerHTML = todoListHTML;
            }
        }
        const todolist = [];

        function addTodo() {
            const inputElement = document.querySelector('.js-name-input');
            const value = inputElement.value;
            todolist.push(value);
            inputElement.value = '';
            renderTodoList()
        }

        function handleTodoKeyDown(event){
            if(event.key === 'Enter'){
                addTodo();
            }
        }

    </script>
</body>

</html>
