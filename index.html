<!DOCTYPE html>
<html lang="en">

<head>
    <title>DOM Practice</title>
</head>

<body>
    <h1>DOM Practice</h1>
    <p>Youtube Subscribe Button</p>
    <button class="js-subscribe-button" onclick="const buttonElement = document.querySelector('.js-subscribe-button');
        if(buttonElement.innerHTML === 'Subscribe'){
            buttonElement.innerHTML = 'Subscribed';
        }
        else{
            buttonElement.innerHTML = 'Subscribe';
        }
        ">Subscribe</button>
</body>

</html>
